<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог товаров «ТЕХНОУЛЫБКА»</title>
<style>body{font-family:Segoe UI,system-ui,sans-serif;background:#f0f4f8;color:#334155;padding:40px;text-align:center}.loading{margin:15vh auto;max-width:560px;background:#fff;padding:28px;border-radius:20px;box-shadow:0 4px 18px #00000010}</style>
</head>
<body>
<div class="loading">Загрузка каталога…</div>
<script>
(async()=>{try{
let html=await fetch('https://raw.githubusercontent.com/nitakysa/techno-ulybka-catalog/6135c04941d0c118d367781107cb8e5f7686f779/index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()});
const imgs={
'495.082.00':'images/product-01.jpg','IMR-1485802':'images/product-02.jpg','BB1497':'images/product-03.jpg','CN2000':'images/product-04.jpg','CN5019':'images/product-05.jpg','CN5008':'images/product-06.jpg','CN2005':'images/product-07.jpg','CN6022MH':'images/product-08.jpg','6П-1600-08 НК-ГОР-Р-ФЛ':'images/product-09.jpg','6П-1200-08 НК-ГОР-Р-ФЛ':'images/product-10.jpg','6П-1200-07 НК-ГОР-Р-ФЛ':'images/product-11.jpg','IMR-1513572':'images/product-12.jpg','IMR-1513573':'images/product-13.jpg','ГВЕНА 05 I':'images/product-14.jpg','ГВЕНА 08 I':'images/product-15.jpg','KRATO 650 I':'images/product-16.jpg','КРАТО 380 I':'images/product-17.jpg','ТРУ-БА 110':'images/product-18.jpg','NS.2330.25.01 / RETA II SN':'images/product-19.jpg','РИНГО О 45W':'images/product-20.jpg'};
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
for(const [article,src] of Object.entries(imgs)){
 const re=new RegExp('(article:\\s*"'+esc(article)+'"[^}]*?img:\\s*)\\[([^\\]]*)\\]');
 html=html.replace(re,(m,p,inside)=>p+'["'+src+'"'+(inside.trim()?','+inside:'')+']');
}
document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<div class="loading"><b>Не удалось загрузить каталог.</b><br><br>Обновите страницу через несколько секунд.</div>';console.error(e)}})();
</script>
</body>
</html>
