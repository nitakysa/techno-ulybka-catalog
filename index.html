        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #f0f4f8; padding: 30px 20px; }
        .container { max-width: 1300px; margin: 0 auto; }

        /* --- ШАПКА --- */
        .header-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }

        .header-brand h1 .brand-text { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 40%, #991b1b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .sub { color: #475569; font-size: 18px; font-weight: 400; margin-bottom: 25px; padding-left: 58px; }
        .sub strong { color: #1e293b; font-weight: 600; }

        /* --- ПАНЕЛЬ ИНСТРУМЕНТОВ --- */
        .toolbar { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin-bottom: 30px; background: #ffffffcc; backdrop-filter: blur(4px); padding: 12px 20px; border-radius: 60px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        .filters { display: flex; flex-wrap: wrap; gap: 8px; }
        .filters button { background: transparent; border: 1.5px solid #e2e8f0; padding: 6px 18px; border-radius: 30px; cursor: pointer; font-size: 14px; transition: 0.2s; font-weight: 500; color: #334155; }
        .filters button:hover { background: #e2e8f0; }
        .filters button.active { background: #1e293b; color: #fff; border-color: #1e293b; }
        .search input { padding: 9px 18px; border-radius: 30px; border: 1.5px solid #e2e8f0; font-size: 15px; outline: none; width: 240px; background: #fff; transition: 0.2s; }
        .search input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px #38bdf840; }
        .btn-pdf { background: #991b1b; color: #fff; border: none; padding: 10px 28px; border-radius: 30px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; margin-left: auto; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px #991b1b40; }
        .btn-pdf:hover { background: #7f1d1d; transform: scale(1.02); box-shadow: 0 6px 20px #991b1b60; }
        .btn-pdf:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        /* --- КАТЕГОРИИ --- */
        .category-title { font-size: 28px; font-weight: 600; margin: 40px 0 20px; padding-bottom: 10px; border-bottom: 4px solid #38bdf8; color: #0f172a; display: flex; align-items: center; gap: 12px; }
        .category-title::before { content: "▌"; color: #991b1b; font-size: 32px; }

        /* --- СЕТКА КАРТОЧЕК --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
        .card { background: #fff; border-radius: 20px; overflow: hidden; transition: 0.25s ease; display: flex; flex-direction: column; border-top: 5px solid #991b1b; box-shadow: 0 4px 14px rgba(0,0,0,0.04); }
        .card:hover { transform: translateY(-6px); box-shadow: 0 16px 36px #38bdf820, 0 4px 14px rgba(0,0,0,0.06); }

        /* --- КАРУСЕЛЬ (СЛАЙДЕР) --- */
        .carousel-container { position: relative; width: 100%; height: 190px; background: #e9edf2; overflow: hidden; }
        .carousel-slides { display: flex; width: 100%; height: 100%; transition: transform 0.4s ease-in-out; }
        .carousel-slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; }
        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: none; padding: 8px 12px; cursor: pointer; font-size: 18px; z-index: 10; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .carousel-btn:hover { background: rgba(0,0,0,0.8); }
        .carousel-btn.prev { left: 6px; }
        .carousel-btn.next { right: 6px; }
        .carousel-dots { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; }
        .carousel-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); border: none; cursor: pointer; padding: 0; transition: 0.2s; }
        .carousel-dot.active { background: #fff; transform: scale(1.2); }

        /* --- КАРТОЧКА ТОВАРА --- */
        .card-body { padding: 16px 18px 20px; flex: 1; display: flex; flex-direction: column; }
        .card-body .name { font-weight: 600; font-size: 16px; color: #0f172a; margin-bottom: 2px; line-height: 1.4; }
        .card-body .article { font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 400; }
        .card-body .qty { font-size: 14px; color: #475569; margin-bottom: 4px; }
        .card-body .price { font-size: 18px; font-weight: 700; color: #0f172a; margin-top: 6px; }

        .card-body .link-btn { margin-top: 12px; display: inline-block; background: #1e3a5f; color: #fff; text-decoration: none; padding: 8px 18px; border-radius: 30px; font-size: 14px; font-weight: 600; transition: 0.2s; text-align: center; align-self: flex-start; border: none; cursor: pointer; }
        .card-body .link-btn:hover { background: #0f172a; transform: scale(1.02); box-shadow: 0 4px 12px #1e3a5f60; }
        .card-body .no-link { margin-top: 12px; font-size: 13px; color: #94a3b8; font-style: italic; }

        /* --- ПОДВАЛ --- */
        .footer { margin-top: 50px; padding-top: 20px; border-top: 2px solid #e2e8f0; text-align: center; color: #94a3b8; font-size: 14px; }
        .footer .brand-name { font-weight: 700; font-size: 18px; letter-spacing: 1px; }
        .footer .brand-name .brand-blue { color: #1e3a5f; }
        .footer .brand-name .brand-red { color: #991b1b; }

    // ================================================================
    // ФУНКЦИЯ СОЗДАНИЯ КАРУСЕЛИ (слайдера)
    // ================================================================
    function createCarousel(images) {
        if (!images || images.length === 0) {
            const div = document.createElement('div');
            div.className = 'card-img-placeholder';
            div.textContent = '🖼️ Фото нет';
            return div;
        }
        if (images.length === 1) {
            const div = document.createElement('div');
            div.className = 'carousel-container';
            // Добавляем обработчик ошибки для одиночного изображения
            div.innerHTML = `<img src="${images[0]}" alt="Товар" style="width:100%; height:100%; object-fit:cover;" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'card-img-placeholder\\'>🖼️ Фото не загружено</div>';">`;
            return div;
        }

        const container = document.createElement('div');
        container.className = 'carousel-container';

        const slidesWrapper = document.createElement('div');
        slidesWrapper.className = 'carousel-slides';

        images.forEach((src, index) => {
            const slide = document.createElement('div');
            slide.className = 'carousel-slide';
            slide.innerHTML = `<img src="${src}" alt="Фото ${index+1}" onerror="this.onerror=null; this.style.display='none'; this.parentElement.textContent='🖼️ Фото не загружено'; this.parentElement.style.background='#e9edf2'; this.parentElement.style.color='#94a3b8'; this.parentElement.style.display='flex'; this.parentElement.style.alignItems='center'; this.parentElement.style.justifyContent='center';">`;
            slidesWrapper.appendChild(slide);
        });

        container.appendChild(slidesWrapper);

        const prevBtn = document.createElement('button');
        prevBtn.className = 'carousel-btn prev';
        prevBtn.innerHTML = '‹';
        prevBtn.setAttribute('aria-label', 'Предыдущий');

        const nextBtn = document.createElement('button');
        nextBtn.className = 'carousel-btn next';
        nextBtn.innerHTML = '›';
        nextBtn.setAttribute('aria-label', 'Следующий');

        container.appendChild(prevBtn);
        container.appendChild(nextBtn);

        const dotsContainer = document.createElement('div');
        dotsContainer.className = 'carousel-dots';
        images.forEach((_, index) => {
            const dot = document.createElement('button');
            dot.className = 'carousel-dot' + (index === 0 ? ' active' : '');
            dot.setAttribute('data-index', index);
            dot.setAttribute('aria-label', `Слайд ${index+1}`);
            dotsContainer.appendChild(dot);
        });
        container.appendChild(dotsContainer);

        let currentIndex = 0;
        const totalSlides = images.length;

        function updateCarousel(index) {
            if (index < 0) index = totalSlides - 1;
            if (index >= totalSlides) index = 0;
            currentIndex = index;
            const offset = -index * 100;
            slidesWrapper.style.transform = `translateX(${offset}%)`;
            const dots = dotsContainer.querySelectorAll('.carousel-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            updateCarousel(currentIndex - 1);
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            updateCarousel(currentIndex + 1);
        });

        dotsContainer.querySelectorAll('.carousel-dot').forEach((dot) => {
            dot.addEventListener('click', (e) => {
                e.stopPropagation();
                const index = parseInt(dot.getAttribute('data-index'), 10);
                updateCarousel(index);
            });
        });

        slidesWrapper.addEventListener('click', (e) => e.stopPropagation());

        return container;
    }

    // ================================================================
    // ОСНОВНАЯ ФУНКЦИЯ ОТРИСОВКИ КАТАЛОГА
    // ================================================================
    function renderCatalog(filterCat = 'all', searchText = '') {
        const container = document.getElementById('catalogContainer');
        container.innerHTML = '';

        let filtered = data;
        if (filterCat !== 'all') {
            filtered = filtered.filter(item => item.category === filterCat);
        }
        if (searchText.trim() !== '') {
            const s = searchText.toLowerCase().trim();
            filtered = filtered.filter(item =>
                item.name.toLowerCase().includes(s) ||
                (item.article && item.article.toLowerCase().includes(s))
            );
        }

        const grouped = {};
        filtered.forEach(item => {
            if (!grouped[item.category]) grouped[item.category] = [];
            grouped[item.category].push(item);
        });

        const sortedCats = Object.keys(grouped).sort();

        if (sortedCats.length === 0) {
            container.innerHTML = '<p style="color:#64748b; margin-top:30px;">🚫 Товары не найдены</p>';
            return;
        }

        sortedCats.forEach(cat => {
            const items = grouped[cat];
            const section = document.createElement('div');
            section.innerHTML = `<div class="category-title">${cat}</div>`;
            const grid = document.createElement('div');
            grid.className = 'grid';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                const carouselElement = createCarousel(item.img);
                card.appendChild(carouselElement);

                const body = document.createElement('div');
                body.className = 'card-body';

                const nameDiv = document.createElement('div');
                nameDiv.className = 'name';
                nameDiv.textContent = item.name;

                const articleDiv = document.createElement('div');
                articleDiv.className = 'article';
                articleDiv.textContent = item.article ? `📌 Арт. ${item.article}` : '';

                const qtyDiv = document.createElement('div');
                qtyDiv.className = 'qty';
                qtyDiv.textContent = `📦 В наличии: ${item.qty} шт.`;

                const priceDiv = document.createElement('div');
                priceDiv.className = 'price';
                priceDiv.innerHTML = `${item.price} <span>за шт.</span>`;

                body.appendChild(nameDiv);
                body.appendChild(articleDiv);
                body.appendChild(qtyDiv);
                body.appendChild(priceDiv);

                if (item.link) {
                    const linkBtn = document.createElement('a');
                    linkBtn.className = 'link-btn';
                    linkBtn.href = item.link;
                    linkBtn.target = '_blank';
                    linkBtn.innerHTML = '🔗 Перейти к товару';
                    body.appendChild(linkBtn);
                } else {
                    const noLink = document.createElement('div');
                    noLink.className = 'no-link';
                    noLink.textContent = '🔜 Скоро появится';
                    body.appendChild(noLink);
                }

                card.appendChild(body);
                grid.appendChild(card);
            });

            section.appendChild(grid);
            container.appendChild(section);
        });
    }

    // ===== ФИЛЬТРЫ =====
    document.querySelectorAll('#filterButtons button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#filterButtons button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const cat = this.dataset.cat;
            const searchVal = document.getElementById('searchInput').value;
            renderCatalog(cat, searchVal);
        });
    });

    function filterCards() {
        const activeCat = document.querySelector('#filterButtons button.active')?.dataset.cat || 'all';
        const searchVal = document.getElementById('searchInput').value;
        renderCatalog(activeCat, searchVal);
    }

    function exportPDF() {
        const btn = document.getElementById('pdfBtn');
        btn.disabled = true;
        btn.innerHTML = '⏳ Создание PDF...';

        if (typeof html2pdf === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
            script.onload = function() {
                generatePDF();
            };
            document.head.appendChild(script);
        } else {
            generatePDF();
        }

        function generatePDF() {
            const element = document.getElementById('catalogContainerRoot');
            const opt = {
                margin: [10, 10, 10, 10],
                filename: 'Техноулыбка_каталог.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save().then(() => {
                btn.disabled = false;
                btn.innerHTML = '📄 Скачать PDF';
            }).catch(() => {
                btn.disabled = false;
                btn.innerHTML = '📄 Скачать PDF';
                alert('Не удалось сгенерировать PDF. Используйте Ctrl+P -> "Сохранить как PDF"');
            });
        }
    }

    // ===== СТАРТ =====
    renderCatalog('all', '');
</script>
